[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imodent"
version = "1.0.0a1"
description = "Code intelligence tool — fix, scan, and advise on Python, JSON, YAML, and Rust (advisory)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "imodent contributors"}
]
keywords = ["code-quality", "formatter", "linter", "python", "json", "yaml", "ast", "import-analysis", "architecture", "rust", "cargo", "clippy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "black>=23.0",
    "ruamel.yaml>=0.18",
    "pyyaml>=6.0",
    "json-repair>=0.20",
    "ruff>=0.1.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
imodent = "imodent.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["imodent*"]

[tool.setuptools.package-data]
imodent = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
